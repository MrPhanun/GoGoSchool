<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — GO-GO International School</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:12px;">
        <button class="icon-toggle-btn" data-theme-toggle onclick="toggleTheme()" aria-label="Toggle dark mode" style="color:var(--ink);">🌙</button>
        <button class="icon-toggle-btn" data-lang-toggle onclick="toggleLang()" style="color:var(--ink);">ខ្មែរ</button>
      </div>
      <div class="brand-badge">🎈</div>
      <h2 data-i18n="login.title">GO-GO Admin Panel</h2>
      <p style="margin-top:-8px;color:var(--text);" data-i18n="login.subtitle">Sign in to manage your school</p>

      <form id="login-form" style="text-align:left;margin-top:20px;">
        <div class="form-row">
          <label for="email" data-i18n="login.emailLabel">Email</label>
          <input type="email" id="email" name="email" required autofocus />
        </div>
        <div class="form-row">
          <label for="password" data-i18n="login.passwordLabel">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" data-i18n="login.submitBtn">Log In</button>
        <div id="login-error" class="login-error"></div>
      </form>

      <div class="login-hint">
        Demo accounts — Admin: <strong>admin@gogo.edu</strong> / Admin@123<br/>
        Teacher: <strong>teacher@gogo.edu</strong> / Teacher@123
      </div>
      <p style="margin-top:18px;"><a href="../index.html" style="color:var(--blue);font-weight:700;" data-i18n="login.backLink">&larr; Back to website</a></p>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="js/admin.js"></script>
  <script>
    const LOGIN_ERROR_KEYS = {
      'Invalid email or password': { en: 'Invalid email or password', km: 'អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ' },
      'Email and password are required': { en: 'Email and password are required', km: 'ត្រូវការអ៊ីមែល និងពាក្យសម្ងាត់' },
    };

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('login-error');
      errorBox.classList.remove('show');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        await api('/api/auth/login', { method: 'POST', body: { email, password } });
        window.location.href = 'dashboard.html';
      } catch (err) {
        const entry = LOGIN_ERROR_KEYS[err.message];
        errorBox.textContent = entry ? entry[getLang()] || entry.en : err.message;
        errorBox.classList.add('show');
      }
    });

    (async () => {
      try {
        const { user } = await api('/api/auth/me');
        if (user) window.location.href = 'dashboard.html';
      } catch (err) { /* not logged in, stay on page */ }
    })();
  </script>
</body>
</html>
