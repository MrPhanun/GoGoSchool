<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements — GO-GO Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="topbar">
        <h1 data-i18n="announcements.title">Announcements</h1>
        <button class="btn btn-primary" id="add-btn" data-i18n="announcements.addBtn">+ New Announcement</button>
      </div>

      <div class="panel">
        <div id="table-wrap">
          <div class="empty-state" data-i18n="announcements.loading">Loading announcements…</div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="announcement-modal">
    <div class="modal">
      <h3 id="modal-title" data-i18n="announcements.modalAddTitle">New Announcement</h3>
      <form id="announcement-form">
        <input type="hidden" id="announcement-id" />
        <div class="form-row">
          <label for="title" data-i18n="announcements.labelTitle">Title</label>
          <input type="text" id="title" required />
        </div>
        <div class="form-row">
          <label for="body" data-i18n="announcements.labelMessage">Message</label>
          <textarea id="body" rows="4" required></textarea>
        </div>
        <div class="form-row">
          <label for="date" data-i18n="announcements.labelDate">Date</label>
          <input type="date" id="date" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('announcement-modal')" data-i18n="common.cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" data-i18n="common.saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="js/admin.js"></script>
  <script>
    let announcements = [];

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      renderSidebar('announcements.html', user);
      await loadAnnouncements();
      window.onLangChange = loadAnnouncements;
    })();

    async function loadAnnouncements() {
      const wrap = document.getElementById('table-wrap');
      try {
        announcements = (await api('/api/announcements')).sort((a, b) => new Date(b.date) - new Date(a.date));
        if (!announcements.length) {
          wrap.innerHTML = `<div class="empty-state"><div class="emoji">📣</div>${t('announcements.empty')}</div>`;
          return;
        }
        wrap.innerHTML = `
          <table>
            <thead><tr><th>${t('announcements.thTitle')}</th><th>${t('announcements.thMessage')}</th><th>${t('announcements.thDate')}</th><th></th></tr></thead>
            <tbody>
              ${announcements.map((a) => `
                <tr>
                  <td><strong>${escapeHtml(a.title)}</strong></td>
                  <td style="max-width:360px;">${escapeHtml(a.body)}</td>
                  <td>${formatDate(a.date)}</td>
                  <td>
                    <div class="row-actions">
                      <button class="icon-btn" title="Edit" onclick="editAnnouncement(${a.id})">✏️</button>
                      <button class="icon-btn danger" title="Delete" onclick="deleteAnnouncement(${a.id})">🗑️</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        wrap.innerHTML = `<div class="empty-state">${t('announcements.loadError')}</div>`;
      }
    }

    document.getElementById('add-btn').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = t('announcements.modalAddTitle');
      document.getElementById('announcement-form').reset();
      document.getElementById('announcement-id').value = '';
      document.getElementById('date').value = todayISO();
      openModal('announcement-modal');
    });

    function editAnnouncement(id) {
      const a = announcements.find((a) => a.id === id);
      if (!a) return;
      document.getElementById('modal-title').textContent = t('announcements.modalEditTitle');
      document.getElementById('announcement-id').value = a.id;
      document.getElementById('title').value = a.title;
      document.getElementById('body').value = a.body;
      document.getElementById('date').value = a.date;
      openModal('announcement-modal');
    }

    async function deleteAnnouncement(id) {
      if (!confirm(t('announcements.confirmDelete'))) return;
      try {
        await api(`/api/announcements/${id}`, { method: 'DELETE' });
        showToast(t('announcements.toastDeleted'));
        await loadAnnouncements();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    document.getElementById('announcement-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('announcement-id').value;
      const payload = {
        title: document.getElementById('title').value.trim(),
        body: document.getElementById('body').value.trim(),
        date: document.getElementById('date').value,
      };
      try {
        if (id) {
          await api(`/api/announcements/${id}`, { method: 'PUT', body: payload });
          showToast(t('announcements.toastUpdated'));
        } else {
          await api('/api/announcements', { method: 'POST', body: payload });
          showToast(t('announcements.toastAdded'));
        }
        closeModal('announcement-modal');
        await loadAnnouncements();
      } catch (err) {
        showToast(err.message, true);
      }
    });
  </script>
</body>
</html>
