<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — GO-GO Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="topbar">
        <h1>Dashboard</h1>
      </div>

      <div class="stat-grid" id="stat-grid">
        <div class="empty-state">Loading dashboard…</div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Quick Overview</h3>
        </div>
        <p>Welcome back! Use the sidebar to manage students, classes, teachers, attendance, fees, announcements, and enrollment inquiries.</p>
      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      if (!user) return;
      renderSidebar('dashboard.html', user);

      try {
        const stats = await api('/api/dashboard');
        const cards = [
          { icon: '🧒', tint: 'var(--coral)', num: stats.totalStudents, label: 'Total Students' },
          { icon: '🏫', tint: 'var(--blue)', num: stats.totalClasses, label: 'Classes' },
          { icon: '👩‍🏫', tint: 'var(--purple)', num: stats.totalTeachers, label: 'Teachers' },
          { icon: '✅', tint: 'var(--green)', num: `${stats.presentToday}/${stats.attendanceMarkedToday}`, label: 'Present Today' },
          { icon: '💰', tint: '#E07A00', num: stats.unpaidFees, label: 'Unpaid Fees' },
          { icon: '✉️', tint: '#C0392B', num: stats.newInquiries, label: 'New Inquiries' },
        ];
        document.getElementById('stat-grid').innerHTML = cards.map((c) => `
          <div class="stat-card">
            <div class="icon" style="background:${c.tint};">${c.icon}</div>
            <div>
              <div class="num">${c.num}</div>
              <div class="label">${c.label}</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('stat-grid').innerHTML = `<div class="empty-state">Could not load dashboard stats.</div>`;
      }
    })();
  </script>
</body>
</html>
